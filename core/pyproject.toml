[project]
name = "answerstack"
version = "0.1.0"
description = "AnswerStack core RAG library — parsing, chunking, embedding, retrieval, generation"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.5",
    "flashrank>=0.2.10",
    "httpx>=0.28.1",
    "openai>=2.29.0",
    "pymupdf4llm>=1.27.2.2",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["answerstack"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
